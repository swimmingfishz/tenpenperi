<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1.0, user-scalable=yes">
    <title>12月</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 三色渐变背景 */
        body {
            background: linear-gradient(180deg, white, #ECFFE3, #FFBD21);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 自由摆放容器 */
        .freeform-container {
            position: relative;
            width: 100%;
            min-height: 1800px;
        }

        /* 绝对定位图片 */
        .freeform-img {
            position: absolute;
            display: block;
            height: auto;
        }

        /* 带文字说明的图片容器 */
        .freeform-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .freeform-item img {
            width: 100%;
            display: block;
        }
        .caption {
            margin-top: 5px;
            font-size: 14px;
        }

        /* 顶部阴影图片 */
        .top-shadow-img {
            display: inline-block;
            border-radius: 0rem;
            padding: 0rem;
            filter: drop-shadow(0.4rem 0.4rem 0.06rem rgba(64, 70, 110, 0.25));
        }

        .top-image-wrapper {
            text-align: center;
            margin-bottom: 0;
            position: relative;
            z-index: 0;
        }

        /* --- 飞行物修正：放大4倍并修正动画 --- */
        .flying-object {
            position: fixed;
            z-index: 1000;
            /* 面积放大4倍 = 宽度放大2倍 (从80px变为320px) 
            width: 160px; 
            top: 10%;
            left: 10%;
            cursor: pointer;
            pointer-events: none;
            animation: bounceFull 10s ease-in-out infinite;
        }


        .flying-object img {
            width: 100%;
            height: auto;
            display: block;
             内层处理自转 
            animation: flyRotate 6s linear infinite;
        }


        @keyframes flyRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
/*        }

        /* 大范围全屏飞行动画 */
        @keyframes bounceFull {
            0% { transform: translate(0, 0); }
            25% { transform: translate(60vw, 10vh); }
            50% { transform: translate(30vw, 70vh); }
            75% { transform: translate(-5vw, 40vh); }
            100% { transform: translate(0, 0); }
        }

        /* 返回主页链接 */
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
        }
        .back-link:hover { background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div class="flying-object">
        <img src="images1/14.png" alt="会飞的图片">
    </div>

    <div class="freeform-container">
        <div class="top-image-wrapper">
            <img class="top-shadow-img" src="images1/1.png" alt="图片1" style="width: 14.3%;">
        </div>

        <img class="freeform-img" src="images1/2.png" alt="图片2" 
             style="left: 9.06%; top: calc(0% + 200px); width: 18.40%; z-index: 10;">

        <img class="freeform-img" src="images1/3.png" alt="图片3" 
             style="left: 64.86%; top: calc(1.23% + 200px); width: 32.20%; z-index: 3;">

        <div class="freeform-item" style="left: 34.52%; top: calc(1.37% + 280px); width: 18.30%; z-index: 12; transform: rotate(337deg);">
            <img src="images1/4.png" alt="图片4" style="width: 100%;">
            <div class="caption" style="text-align: center;">
                <span style="color: rgba(0, 34, 255, 0.85);">最爱烤爸爸</span>
            </div>
        </div>

        <div class="freeform-item" style="left: calc(35.34%); top: calc(10.02% + 250px); width: 38.60%; z-index: 2;">
            <img src="images1/5.png" alt="图片5" style="width: 100%;">
            <div class="caption" style="text-align: center;">
                <span style="color: rgba(0, 51, 255, 0.85);">.</span>
            </div>
        </div>

        <img class="freeform-img" src="images1/6.png" alt="图片6" 
             style="left: calc(9.06% + 150px); top: calc(0% + 450px); width: 18.40%; z-index: 6;">

        <img class="freeform-img" src="images1/7.png" alt="图片7" 
             style="left: 40.98%; top: calc(13.09% + 250px); width: 5.10%; z-index: 5;">

        <img class="freeform-img" src="images1/8.png" alt="图片8" 
             style="left: 86.61%; top: calc(27.71% + 250px); width: 7.10%; z-index: 4;">

        <img class="freeform-img" src="images1/9.png" alt="图片9" 
             style="left: 57.35%; top: calc(33.34% + 200px); width: 18.70%; z-index: 9;">

        <img class="freeform-img" src="images1/10.png" alt="图片10" 
             style="left: 75.38%; top: calc(34.24% + 200px); width: 10.40%; z-index: 8;">

        <img class="freeform-img" src="images1/11.png" alt="图片11" 
             style="left: 5.07%; top: calc(35.10% + 250px); width: 16.00%; z-index: 10; transform: rotate(347deg);">

        <img class="freeform-img" src="images1/12.png" alt="图片12" 
             style="left: 36.97%; top: calc(44.72% + 150px); width: 21.60%; z-index: 7;">

        <img class="freeform-img" src="images1/13.png" alt="图片13" 
             style="left: 18.81%; top: calc(82.02% + 250px); width: 61.50%; z-index: 11;">
    </div>

    <a href="../index.html" class="back-link">← 返回主页</a>

</body>
</html>
